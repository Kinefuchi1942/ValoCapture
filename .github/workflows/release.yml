# v1.2.3 のようなタグをプッシュすると、tools/publish.ps1 で Velopack のインストーラーと更新パッケージを作り、GitHub Releases に公開する
# 利用者は https://github.com/Kinefuchi1942/ValoCapture/releases/latest/download/ValoCapture-win-Setup.exe から常に最新版を入れられる
# 入れたあとはアプリが同じリリースの releases.win.json と *.nupkg を読んで自動更新する
name: リリース

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # タグと csproj の <Version> がずれていると、更新パッケージのバージョンや exe のプロパティが食い違う
      - name: タグとバージョンの一致を確認
        id: version
        run: |
          $csproj = 'src\ValoCapture.App\ValoCapture.App.csproj'
          $version = ([xml](Get-Content $csproj -Encoding UTF8)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "タグ $env:GITHUB_REF_NAME と $csproj の <Version>$version</Version> が一致しません。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

          # バージョンを上げるコミットの件名を「1.2.3: 主要な変更」にしておくと、それをリリースのタイトルにする
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $subject = git log -1 --format=%s
          $title = if ($subject.StartsWith("${version}: ")) { "ValoCapture $subject" } else { "ValoCapture $version" }
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: テスト
        run: dotnet test tests/ValoCapture.Core.Tests -nologo

      # BuildExe.bat と同じ Windows PowerShell で動かす。前回のリリースを取ってきて差分の更新パッケージも作る
      - name: インストーラーと更新パッケージを作る
        shell: powershell
        run: ./tools/publish.ps1 -RepoUrl "https://github.com/$env:GITHUB_REPOSITORY" -Token "${{ github.token }}"

      # 先に説明付きでリリースを作り、vpk upload --merge で Velopack のファイルを添付する
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          $notes = @"
          ## ダウンロード

          - **ValoCapture-win-Setup.exe** … インストーラーです。ダブルクリックするとインストールして起動します。以降の更新はアプリ内で行えます
          - **ValoCapture-win-Portable.zip** … インストールせずに使う場合はこちら。好きなフォルダに展開して ValoCapture.exe を起動してください

          使い方は [README](https://github.com/$env:GITHUB_REPOSITORY#readme) を参照してください。
          "@
          gh release create $env:GITHUB_REF_NAME --title $env:TITLE --notes $notes --generate-notes
          dotnet vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN `
            -o dist/releases --merge --publish --tag $env:GITHUB_REF_NAME --releaseName $env:TITLE
          if ($LASTEXITCODE -ne 0) { throw 'リリースへの添付に失敗しました。' }
