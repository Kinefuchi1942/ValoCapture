# v1.2.3 のようなタグをプッシュすると、tools/publish.ps1 で exe と zip を作って GitHub Releases に公開する
# 利用者は https://github.com/Kinefuchi1942/ValoCapture/releases/latest/download/ValoCapture.exe から常に最新版を落とせる
name: リリース

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # タグと csproj の <Version> がずれていると、zip の名前や exe のプロパティが食い違う
      - name: タグとバージョンの一致を確認
        id: version
        run: |
          $csproj = 'src\ValoCapture.App\ValoCapture.App.csproj'
          $version = ([xml](Get-Content $csproj -Encoding UTF8)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "タグ $env:GITHUB_REF_NAME と $csproj の <Version>$version</Version> が一致しません。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: テスト
        run: dotnet test tests/ValoCapture.Core.Tests -nologo

      # BuildExe.bat と同じ Windows PowerShell で動かす
      - name: exe と zip を作る
        shell: powershell
        run: ./tools/publish.ps1

      # exe は名前を固定して、releases/latest/download/ValoCapture.exe が常に最新版を指すようにする
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @"
          ## ダウンロード

          - **ValoCapture.exe** … これだけで動きます。好きなフォルダに置いてダブルクリックしてください
          - **ValoCapture-$env:VERSION.zip** … exe と説明書（はじめにお読みください.txt）のセット

          使い方は [README](https://github.com/$env:GITHUB_REPOSITORY#readme) を参照してください。
          "@
          gh release create $env:GITHUB_REF_NAME `
            dist/ValoCapture.exe "dist/ValoCapture-$env:VERSION.zip" `
            --title "ValoCapture $env:VERSION" --notes $notes --generate-notes
